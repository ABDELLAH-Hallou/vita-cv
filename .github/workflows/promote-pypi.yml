name: Promote approved release to PyPI

on:
  workflow_dispatch:
    inputs:
      promotion_pr:
        description: Merged PyPI promotion PR number (validated before publication)
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: pypi-promotion-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  verify:
    name: Verify merged promotion and tested files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - name: Check out the tested version tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate approval, successful TestPyPI run, and artifact hashes
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.release_promotion prepare --dist dist
      - name: Smoke test the exact promoted wheel
        run: python tests/smoke/run_installed_package.py dist
      - name: Retain verified files for publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approved-pypi-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Retain the validated promotion record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approved-promotion-record
          path: promotion-record.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish approved files to PyPI
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/vita-cv
    steps:
      - name: Download the verified TestPyPI files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: approved-pypi-distributions
          path: dist
      - name: Upload without rebuilding
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          attestations: false
          verbose: true
          skip-existing: true

  finalize:
    name: Verify PyPI and finalize the GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the tested version tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Download the validated promotion record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: approved-promotion-record
      - name: Confirm PyPI hashes and mark the GitHub release stable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: python -m scripts.release_promotion finalize
