name: Dispatch merged PyPI promotion

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: dispatch-pypi-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/pypi-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the approved merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Dispatch publishing on the tested version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.release_promotion dispatch
