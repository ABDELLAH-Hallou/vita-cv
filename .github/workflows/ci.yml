name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  conventional-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python -m scripts.validate_pr_title "$PR_TITLE"

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify lock file
        run: uv lock --check
      - name: Install locked development environment
        run: uv sync --locked --all-groups
      - name: Lint Python
        run: uv run ruff check .
      - name: Compile Python sources
        run: uv run python -m compileall -q vita tests scripts

  regression:
    name: Regression tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked development environment
        run: uv sync --locked --all-groups --python ${{ matrix.python-version }}
      - name: Install LaTeX for document integration tests
        if: matrix.python-version == '3.12'
        timeout-minutes: 5
        shell: bash
        run: |
          # The runner's Azure mirror has stalled LaTeX downloads until job timeout.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends latexmk texlive-latex-base
      - name: Run regression suite with branch coverage
        run: uv run --python ${{ matrix.python-version }} pytest --ignore=tests/smoke --cov=vita --cov-report=term-missing
      - name: Verify benchmark handoff with real LaTeX
        if: matrix.python-version == '3.12'
        run: uv run python -m scripts.benchmark --case openai-extract-true --real-pdf --output .vita/benchmark-real-pdf

  fixture-conformance:
    name: Standalone fixture conformance (no live providers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run all adapters, reasoning variants, toggles, and failure fixtures
        run: python -m scripts.benchmark --output .vita/benchmark-fixtures
      - name: Preserve first attempts, recovery records, and frozen outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-fixture-conformance
          path: .vita/benchmark-fixtures
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  multilingual:
    name: Multilingual structural and PDF conformance (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install explicit Unicode engine, language packages, fonts and PDF inspection tools
        timeout-minutes: 8
        shell: bash
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install --yes --no-install-recommends latexmk texlive-xetex texlive-lang-arabic texlive-lang-french texlive-lang-spanish fonts-hosny-amiri fonts-dejavu-core poppler-utils fontconfig
      - name: Exercise all language pairs, lengths, included files and limit controls
        run: python -m scripts.multilingual --real-pdf --output .vita/multilingual-fixtures
      - name: Preserve sources, held proposals, compiler logs, geometry and all page images
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multilingual-synthetic-conformance
          path: .vita/multilingual-fixtures
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked development environment
        run: uv sync --locked --all-groups
      - name: Export locked dependencies
        run: uv export --all-groups --no-emit-project --no-hashes --output-file audit-requirements.txt
      - name: Audit dependencies
        run: uv run pip-audit --strict --requirement audit-requirements.txt

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked development environment
        run: uv sync --locked --all-groups
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Validate distribution metadata
        run: uv run twine check --strict dist/*
      - name: Upload immutable build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Installed package smoke test
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Download built distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - name: Smoke test the installed wheel
        run: python tests/smoke/run_installed_package.py dist

  gate:
    name: CI gate
    if: always()
    needs:
      [conventional-title, quality, regression, fixture-conformance, multilingual, dependency-audit, dependency-review, package, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every applicable check to pass
        env:
          TITLE: ${{ needs.conventional-title.result }}
          QUALITY: ${{ needs.quality.result }}
          REGRESSION: ${{ needs.regression.result }}
          AUDIT: ${{ needs.dependency-audit.result }}
          REVIEW: ${{ needs.dependency-review.result }}
          PACKAGE: ${{ needs.package.result }}
          SMOKE: ${{ needs.smoke.result }}
          CONFORMANCE: ${{ needs.fixture-conformance.result }}
          MULTILINGUAL: ${{ needs.multilingual.result }}
        run: |
          test "$TITLE" = success || test "$TITLE" = skipped
          test "$QUALITY" = success
          test "$REGRESSION" = success
          test "$AUDIT" = success
          test "$PACKAGE" = success
          test "$SMOKE" = success
          test "$CONFORMANCE" = success
          test "$MULTILINGUAL" = success
          test "$REVIEW" = success || test "$REVIEW" = skipped
