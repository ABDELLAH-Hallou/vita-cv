[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "vita-cv"
version = "0.1.0"
authors = [
    {name = "Abdellah HALLOU", email = "your.email@example.com"}
]
description = "Resume as a Service — personal CV management CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["resume", "cv", "career", "latex", "git"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Office/Business",
]
dependencies = []

[project.scripts]
vita = "vita.__main__:main"

[project.urls]
"Homepage" = "https://github.com/AbdellahHallou/vita-cv"
"Bug Tracker" = "https://github.com/AbdellahHallou/vita-cv/issues"

[tool.setuptools.packages.find]
include = ["vita*"]

[tool.setuptools.package-data]
vita = ["assets/prompts/*.md", "assets/skills/*.md"]
