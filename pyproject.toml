[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vita-cv"
dynamic = ["version"]
authors = [
    {name = "Abdellah HALLOU", email = "abdeallahhallou33@gmail.com"}
]
description = "VITA — CV as Code : personal CV management CLI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["resume", "cv", "career", "latex", "git"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Office/Business",
    "Topic :: Utilities",
    "Topic :: Education",
]

dependencies = []

[project.scripts]
vita = "vita.__main__:main"

[project.urls]
"Homepage" = "https://github.com/ABDELLAH-Hallou/vita-cv"
"Bug Tracker" = "https://github.com/ABDELLAH-Hallou/vita-cv/issues"

[tool.setuptools.packages.find]
include = ["vita*"]

[tool.setuptools.dynamic]
version = {attr = "vita.__version__"}

[tool.setuptools.package-data]
vita = ["assets/prompts/*.md", "assets/skills/*.md"]

# ── uv ────────────────────────────────────────────────────────────────────────
# Declares vita-cv as a uv tool.
# Install: uv tool install vita-cv
# Upgrade: uv tool upgrade vita-cv
# Run once without installing: uv tool run vita-cv <command>

[dependency-groups]
dev = [
    "build>=1.6.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "twine>=7.0.0",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "regression: protects established behavior from regressions",
    "smoke: validates an installed distribution end to end",
]

[tool.coverage.run]
branch = true
source = ["vita"]

[tool.coverage.report]
fail_under = 30
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I"]
