[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "vita-cv"
version = "0.2.0b3"
authors = [
    {name = "Abdellah HALLOU", email = "abdeallahhallou33@gmail.com"}
]
description = "VITA — CV as Code : personal CV management CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["resume", "cv", "career", "latex", "git"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Office/Business",
    "Topic :: Utilities",
    "Topic :: Education",
]

dependencies = []

[project.scripts]
vita = "vita.__main__:main"

[project.urls]
"Homepage" = "https://github.com/ABDELLAH-Hallou/vita-cv"
"Bug Tracker" = "https://github.com/ABDELLAH-Hallou/vita-cv/issues"

[tool.setuptools.packages.find]
include = ["vita*"]

[tool.setuptools.package-data]
vita = ["assets/prompts/*.md", "assets/skills/*.md"]

# ── uv ────────────────────────────────────────────────────────────────────────
# Declares vita-cv as a uv tool.
# Install: uv tool install vita-cv
# Upgrade: uv tool upgrade vita-cv
# Run once without installing: uv tool run vita-cv <command>

[dependency-groups]
dev = [
    "build>=1.0",
    "twine>=5.0",
]
